<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist – Saree Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background-color: #fef9f2;
            color: #2d241e;
            padding: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 2rem;
            color: #9b5e3c;
            border-left: 5px solid #e7cfb5;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }
        .wishlist-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .wishlist-item {
            background: #fefaf5;
            border-radius: 20px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border: 1px solid #f0e2d4;
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .item-img {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            background: #f0e2d4;
        }
        .item-details h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .item-price {
            color: #b45f3b;
            font-weight: bold;
        }
        .old-price {
            text-decoration: line-through;
            color: #aa8e78;
            margin-right: 10px;
            font-size: 0.9rem;
        }
        .remove-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #b1624b;
            transition: 0.2s;
        }
        .remove-btn:hover {
            color: #c0392b;
            transform: scale(1.1);
        }
        .empty-message {
            text-align: center;
            padding: 3rem;
            background: #fef3ea;
            border-radius: 24px;
            color: #9b6e50;
        }
        .nav-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .nav-links a {
            background: #f0e2d4;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #5a3e2a;
            font-weight: 500;
        }
        .nav-links a:hover {
            background: #e3cfbc;
        }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-heart" style="color:#e68383"></i> My Wishlist</h1>
    <div id="wishlistContainer" class="wishlist-grid">
        <!-- Dynamic content -->
    </div>
    <div class="nav-links">
        <a href="Products.html"><i class="fas fa-shopping-bag"></i> Continue Shopping</a>
        <a href="Profile.html"><i class="fas fa-user"></i> My Profile</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDtWPGZedQ2gwGYGDyJNc4-rM3LbWUsMtY",
        authDomain: "renukacutlary.firebaseapp.com",
        projectId: "renukacutlary",
        storageBucket: "renukacutlary.firebasestorage.app",
        messagingSenderId: "822608333582",
        appId: "1:822608333582:web:044c9635805ba5125fa55f"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Product catalog (must match product.html exactly)
    const productCatalog = [
        { id: "butterfly_darbari", name: "Butterfly Darbari", originalPrice: 700, salePrice: 500, currency: "RS", image: "butterflu darbari.jpeg" },
        { id: "banarasi", name: "Banarasi Saree", originalPrice: 3000, salePrice: 1, currency: "RS", image: "https://placehold.co/600x800/e2cfbb/b56136?text=Banarasi" },
        { id: "paithani", name: "Paithani Saree", originalPrice: 3000, salePrice: 899, currency: "RS", image: "https://placehold.co/600x800/dac2ab/c18457?text=Paithani" },
        { id: "bandhani", name: "Bandhani Saree", originalPrice: 3000, salePrice: 999, currency: "RS", image: "https://placehold.co/600x800/e7cfb9/d0875a?text=Bandhani" },
        { id: "patola", name: "Patola Saree", originalPrice: 3000, salePrice: 1199, currency: "RS", image: "https://placehold.co/600x800/d3baa0/b96f45?text=Patola" }
    ];

    let currentUid = null;
    function getWishlistKey() {
        return currentUid ? `saree_wishlist_${currentUid}` : null;
    }

    function getWishlist() {
        const key = getWishlistKey();
        if (!key) return [];
        const stored = localStorage.getItem(key);
        return stored ? JSON.parse(stored) : [];
    }

    function saveWishlist(wishlist) {
        const key = getWishlistKey();
        if (key) {
            localStorage.setItem(key, JSON.stringify(wishlist));
            // Notify other pages (profile, etc.)
            window.dispatchEvent(new StorageEvent('storage', { key: key, newValue: JSON.stringify(wishlist) }));
        }
    }

    function removeFromWishlist(productId) {
        let wishlist = getWishlist();
        wishlist = wishlist.filter(id => id !== productId);
        saveWishlist(wishlist);
        renderWishlist(); // re-render
    }

    function renderWishlist() {
        const container = document.getElementById("wishlistContainer");
        const wishlistIds = getWishlist();
        if (!wishlistIds.length) {
            container.innerHTML = `<div class="empty-message">💔 Your wishlist is empty. <br> <a href="product.html" style="color:#b45f3b;">Explore our sarees</a> and add your favourites ❤️</div>`;
            return;
        }

        const wishlistItems = wishlistIds.map(id => productCatalog.find(p => p.id === id)).filter(p => p);
        if (wishlistItems.length === 0) {
            container.innerHTML = `<div class="empty-message">Some items are missing. Please re-add them from the product page.</div>`;
            return;
        }

        container.innerHTML = wishlistItems.map(product => `
            <div class="wishlist-item" data-id="${product.id}">
                <div class="item-info">
                    <img class="item-img" src="${product.image}" alt="${product.name}" onerror="this.src='https://placehold.co/70x90/f2e2d4/c2835a?text=Saree'">
                    <div class="item-details">
                        <h3>${product.name}</h3>
                        <div>
                            <span class="old-price">${product.currency}. ${product.originalPrice.toFixed(2)}</span>
                            <span class="item-price">${product.currency}. ${product.salePrice.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
                <button class="remove-btn" data-id="${product.id}" title="Remove from wishlist">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        `).join("");

        // Add remove event listeners
        document.querySelectorAll(".remove-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const productId = btn.dataset.id;
                removeFromWishlist(productId);
            });
        });
    }

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUid = user.uid;
        renderWishlist();
    });

    // Listen for changes in localStorage (if user updates wishlist from product page)
    window.addEventListener("storage", (event) => {
        if (event.key === getWishlistKey()) {
            renderWishlist();
        }
    });
</script>
</body>
</html>
